name: Systemix Engine — propose next bet

# The weekly LLM stage of the loop engine: read the evidence digest (LEARNINGS
# recall + ODI ranking + goals + running experiments) and queue ONE
# hypothesis-proposal card in .systemix/queue.json. Propose-only — a human
# approves the card on Home (/config); approval scaffolds the contract, and
# nothing ships until /write-variants and a merged PR.
# Requires repo secret: ANTHROPIC_API_KEY. Without it the run skips (no PR) —
# the same graceful "not-wired" posture as the PostHog crons.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, before the daily deterministic crons
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no engine key (not-wired pattern)
        id: gate
        run: echo "wired=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.wired == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.gate.outputs.wired == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate hypothesis proposal (propose-only)
        if: steps.gate.outputs.wired == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/propose-experiment"
          # Containment: the model can read the repo and run ONLY the two
          # deterministic propose subcommands — it cannot edit files or run
          # arbitrary bash. All queue writes go through the validated CLI door.
          claude_args: >-
            --max-turns 15
            --allowedTools "Bash(npx @systemix/cli propose:*),Bash(node packages/cli/bin/cli.js propose:*),Read,Glob,Grep"

      - name: Open PR with the proposal card
        if: steps.gate.outputs.wired == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: systemix/engine-propose
          base: main
          title: "chore(engine): hypothesis proposal for review"
          commit-message: "chore(engine): queue hypothesis-proposal card (propose-only)"
          body: |
            The engine's weekly generate stage: ONE hypothesis-proposal card in
            `.systemix/queue.json`, drafted from the LEARNINGS recall, the ODI
            opportunity ranking, and the active goals.

            Merge, then approve or reject the card on Home (`/config`) —
            approving scaffolds `experiments/<id>.mdx`. Nothing ships until
            `/write-variants` and a merged PR; the engine never creates the
            experiment itself.
          # Scope to the queue — node_modules is checked in, npm ci churns it.
          add-paths: |
            .systemix/queue.json
